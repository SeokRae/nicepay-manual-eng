title: NicePay For Startups Manual (EN)
description: English-language integration guide for NicePay's For Startups payment service, for overseas merchants.
theme: minima

nav:
  - title: Getting Started
    pages:
      - INTEGRATION-PATHS.md
      - QUICKSTART.md
      - CHANGELOG.md
  - title: Information
    pages:
      - info/nicepay-info-key.md
      - info/nicepay-info-basic-token.md
      - info/nicepay-info-firewall-timeout.md
      - info/nicepay-info-general.md
      - info/nicepay-info-sandbox.md
      - info/nicepay-info-pci-dss.md
  - title: API
    pages:
      - api/nicepay-api-uri-list.md
      - api/nicepay-api-payment-window-url.md
      - api/nicepay-api-billing.md
      - api/nicepay-api-keyin.md
      - api/nicepay-api-access-token.md
      - api/nicepay-api-retrieve.md
      - api/nicepay-api-cancel.md
      - api/nicepay-api-reconciliation.md
      - api/nicepay-api-webhook.md
  - title: Code
    pages:
      - code/nicepay-code.md

# Jekyll renders every Markdown file at the repo root, so CLAUDE.md (internal
# contributor guidance, not merchant documentation) would otherwise be served
# at /CLAUDE.html. Declaring `exclude` replaces Jekyll's default list rather
# than adding to it, so the defaults are repeated below.
exclude:
  - CLAUDE.md
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
