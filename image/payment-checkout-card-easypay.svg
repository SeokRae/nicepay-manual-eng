<svg viewBox="0 0 656 1146" xmlns="http://www.w3.org/2000/svg" role="img">
<style>:root {
  --bg:#f4f7fc; --surface:#ffffff; --border:rgba(28,60,110,0.16);
  --text:#1b2635; --muted:#54667e; --accent:#1f6fd0; --warn:#8a6210;
  --tone-danger:#dc2626; --tone-warn:#d97706; --tone-info:#0ea5e9;
  --atone-slate:#475569; --atone-violet:#635bff; --atone-deep:#1a1552; --atone-tx:#ffffff; --atone-sub:rgba(255,255,255,0.78);
  --line:#3f4b5c; --line-soft:#93a1b3;
  --note-bg:rgba(181,126,10,0.07); --note-bd:rgba(181,126,10,0.42);
  --act-bg:rgba(31,111,208,0.12); --act-bd:rgba(31,111,208,0.32);
  --zone-bg:rgba(31,111,208,0.07); --zone-bd:rgba(31,111,208,0.30);
  --font:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif;
  --mono:ui-monospace,"JetBrains Mono",Menlo,monospace;
}
.zone{fill:var(--zone-bg);stroke:var(--zone-bd);stroke-width:1.5;}
.zone-tx{fill:var(--accent);font-family:var(--font);font-size:11px;font-weight:700;}
.actor{fill:var(--zone-bg);stroke:var(--zone-bd);stroke-width:1.5;}
.actor-tx{fill:var(--accent);font-family:var(--font);font-size:11.5px;font-weight:700;}
.actor-sub{fill:var(--muted);font-family:var(--mono);font-size:9px;}
.lifeline{stroke:var(--line-soft);stroke-opacity:0.4;stroke-width:1;stroke-dasharray:5,5;}
.act-bar{fill:var(--act-bg);stroke:var(--act-bd);stroke-width:1;}
.ar{fill:none;}
.ar-req{stroke:var(--line);stroke-width:1.8;}
.ar-res{stroke:var(--line-soft);stroke-width:1.5;stroke-dasharray:6,4;}
.ar-relay{stroke:var(--line-soft);stroke-width:1.4;}
.ar-self{stroke:var(--line);stroke-width:1.6;}
.mk-req,.mk-self{fill:var(--line);}
.mk-res,.mk-relay{fill:var(--line-soft);}
text{font-family:var(--font);}
.lb-req,.lb-self{fill:var(--text);font-size:10.5px;font-weight:600;}
.lb-res{fill:var(--muted);font-size:10.5px;}
.lb-relay{fill:var(--muted);font-size:10.5px;font-style:italic;}
.lb-sub{fill:var(--muted);font-size:10px;font-weight:400;font-family:var(--mono);}
.lb-proto{fill:var(--muted);font-size:9.5px;font-family:var(--mono);}
.note-rule{stroke:var(--zone-bd);stroke-width:1;stroke-dasharray:4,4;}
.note{fill:var(--zone-bg);stroke:var(--zone-bd);stroke-width:1;}
.note-tx{fill:var(--accent);font-size:10.5px;font-weight:600;}
.tone-danger{stroke:var(--tone-danger);} text.tone-danger{fill:var(--tone-danger);stroke:none;}
.tone-warn{stroke:var(--tone-warn);}     text.tone-warn{fill:var(--tone-warn);stroke:none;}
.tone-info{stroke:var(--tone-info);}     text.tone-info{fill:var(--tone-info);stroke:none;}
.mk-tone-danger{fill:var(--tone-danger);}
.mk-tone-warn{fill:var(--tone-warn);}
.mk-tone-info{fill:var(--tone-info);}
.actor.atone-slate{fill:var(--atone-slate);stroke:var(--atone-slate);}
.actor.atone-violet{fill:var(--atone-violet);stroke:var(--atone-violet);}
.actor.atone-deep{fill:var(--atone-deep);stroke:var(--atone-deep);}
.actor-tx.atone-slate,.actor-tx.atone-violet,.actor-tx.atone-deep{fill:var(--atone-tx);}
.actor-sub.atone-slate,.actor-sub.atone-violet,.actor-sub.atone-deep{fill:var(--atone-sub);}
.panel-title{fill:var(--text);font-family:var(--font);font-size:15px;font-weight:700;}</style>
<defs><marker id="mk-req" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path class="mk mk-req" d="M0,0 L0,8 L8,4z"/></marker><marker id="mk-res" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path class="mk mk-res" d="M0,0 L0,8 L8,4z"/></marker><marker id="mk-relay" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path class="mk mk-relay" d="M0,0 L0,8 L8,4z"/></marker><marker id="mk-self" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path class="mk mk-self" d="M0,0 L0,8 L8,4z"/></marker><marker id="mk-tone-danger" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path class="mk mk-tone-danger" d="M0,0 L0,8 L8,4z"/></marker><marker id="mk-tone-info" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path class="mk mk-tone-info" d="M0,0 L0,8 L8,4z"/></marker><marker id="mk-tone-warn" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path class="mk mk-tone-warn" d="M0,0 L0,8 L8,4z"/></marker></defs>
<text class="panel-title" x="0" y="22">Normal completion</text>
<g transform="translate(0,34)"><line class="lifeline" x1="128.0" y1="58" x2="128.0" y2="503"/><line class="lifeline" x1="328.0" y1="58" x2="328.0" y2="503"/><line class="lifeline" x1="528.0" y1="58" x2="528.0" y2="503"/><rect class="actor atone-slate" x="62.0" y="14" width="132" height="44" rx="9"/><text class="actor-tx atone-slate" x="128.0" y="40.0" text-anchor="middle">Customer</text><rect class="actor atone-violet" x="262.0" y="14" width="132" height="44" rx="9"/><text class="actor-tx atone-violet" x="328.0" y="40.0" text-anchor="middle">Merchant Server</text><rect class="actor atone-deep" x="462.0" y="14" width="132" height="44" rx="9"/><text class="actor-tx atone-deep" x="528.0" y="40.0" text-anchor="middle">NicePay Checkout</text><rect class="act-bar" x="322.0" y="101" width="12" height="61" rx="2"/><rect class="act-bar" x="322.0" y="209" width="12" height="74" rx="2"/><rect class="act-bar" x="322.0" y="437" width="12" height="40" rx="2"/><rect class="act-bar" x="122.0" y="101" width="12" height="20" rx="2"/><rect class="act-bar" x="122.0" y="263" width="12" height="61" rx="2"/><rect class="act-bar" x="122.0" y="396" width="12" height="20" rx="2"/><rect class="act-bar" x="522.0" y="142" width="12" height="87" rx="2"/><rect class="act-bar" x="522.0" y="304" width="12" height="153" rx="2"/><line class="ar-req ar" x1="129.0" y1="111" x2="326.0" y2="111" marker-end="url(#mk-req)"/><text class="lb-req" x="228.0" y="105" text-anchor="middle">1. Send order</text><line class="ar-req ar" x1="329.0" y1="152" x2="526.0" y2="152" marker-end="url(#mk-req)"/><text class="lb-req" x="428.0" y="146" text-anchor="middle">2. Create checkout</text><text class="lb-proto" x="428.0" y="165" text-anchor="middle">( POST /v1/checkout )</text><text class="lb-sub" x="428.0" y="178" text-anchor="middle">method: cardAndEasyPay</text><line class="ar-res ar" x1="527.0" y1="219" x2="330.0" y2="219" marker-end="url(#mk-res)"/><text class="lb-res" x="428.0" y="213" text-anchor="middle">3. Return checkout</text><text class="lb-sub" x="428.0" y="232" text-anchor="middle">resultCode: 0000, url, status: ready</text><line class="ar-req ar" x1="327.0" y1="273" x2="130.0" y2="273" marker-end="url(#mk-req)"/><text class="lb-req" x="228.0" y="267" text-anchor="middle">4. Redirect to checkout URL</text><line class="ar-req ar" x1="129.0" y1="314" x2="526.0" y2="314" marker-end="url(#mk-req)"/><text class="lb-req" x="328.0" y="308" text-anchor="middle">5. Access Checkout page</text><text class="lb-sub" x="328.0" y="327" text-anchor="middle">select card or easy-pay wallet</text><line class="note-rule" x1="28" y1="360.0" x2="628" y2="360.0"/><rect class="note" x="207.27499999999992" y="349" width="241.45000000000013" height="22" rx="4"/><text class="note-tx" x="328.0" y="364.0" text-anchor="middle">Response field set varies by payMethod</text><line class="ar-req ar" x1="129.0" y1="406" x2="526.0" y2="406" marker-end="url(#mk-req)"/><text class="lb-req" x="328.0" y="400" text-anchor="middle">6. Authenticate / approve payment</text><line class="ar-req ar" x1="527.0" y1="447" x2="330.0" y2="447" marker-end="url(#mk-req)"/><text class="lb-req" x="428.0" y="441" text-anchor="middle">7. Payment Authorization callback</text><text class="lb-proto" x="428.0" y="460" text-anchor="middle">( POST {returnUrl} )</text><text class="lb-sub" x="428.0" y="473" text-anchor="middle">success: true, status: paid</text></g>
<text class="panel-title" x="0" y="599">Authentication or payment failure</text>
<g transform="translate(0,611)"><line class="lifeline" x1="128.0" y1="58" x2="128.0" y2="503"/><line class="lifeline" x1="328.0" y1="58" x2="328.0" y2="503"/><line class="lifeline" x1="528.0" y1="58" x2="528.0" y2="503"/><rect class="actor atone-slate" x="62.0" y="14" width="132" height="44" rx="9"/><text class="actor-tx atone-slate" x="128.0" y="40.0" text-anchor="middle">Customer</text><rect class="actor atone-violet" x="262.0" y="14" width="132" height="44" rx="9"/><text class="actor-tx atone-violet" x="328.0" y="40.0" text-anchor="middle">Merchant Server</text><rect class="actor atone-deep" x="462.0" y="14" width="132" height="44" rx="9"/><text class="actor-tx atone-deep" x="528.0" y="40.0" text-anchor="middle">NicePay Checkout</text><rect class="act-bar" x="322.0" y="101" width="12" height="61" rx="2"/><rect class="act-bar" x="322.0" y="209" width="12" height="74" rx="2"/><rect class="act-bar" x="322.0" y="437" width="12" height="40" rx="2"/><rect class="act-bar" x="122.0" y="101" width="12" height="20" rx="2"/><rect class="act-bar" x="122.0" y="263" width="12" height="61" rx="2"/><rect class="act-bar" x="122.0" y="396" width="12" height="20" rx="2"/><rect class="act-bar" x="522.0" y="142" width="12" height="87" rx="2"/><rect class="act-bar" x="522.0" y="304" width="12" height="153" rx="2"/><line class="ar-req ar" x1="129.0" y1="111" x2="326.0" y2="111" marker-end="url(#mk-req)"/><text class="lb-req" x="228.0" y="105" text-anchor="middle">1. Send order</text><line class="ar-req ar" x1="329.0" y1="152" x2="526.0" y2="152" marker-end="url(#mk-req)"/><text class="lb-req" x="428.0" y="146" text-anchor="middle">2. Create checkout</text><text class="lb-proto" x="428.0" y="165" text-anchor="middle">( POST /v1/checkout )</text><text class="lb-sub" x="428.0" y="178" text-anchor="middle">method: cardAndEasyPay</text><line class="ar-res ar" x1="527.0" y1="219" x2="330.0" y2="219" marker-end="url(#mk-res)"/><text class="lb-res" x="428.0" y="213" text-anchor="middle">3. Return checkout</text><text class="lb-sub" x="428.0" y="232" text-anchor="middle">resultCode: 0000, url, status: ready</text><line class="ar-req ar" x1="327.0" y1="273" x2="130.0" y2="273" marker-end="url(#mk-req)"/><text class="lb-req" x="228.0" y="267" text-anchor="middle">4. Redirect to checkout URL</text><line class="ar-req ar" x1="129.0" y1="314" x2="526.0" y2="314" marker-end="url(#mk-req)"/><text class="lb-req" x="328.0" y="308" text-anchor="middle">5. Access Checkout page</text><text class="lb-sub" x="328.0" y="327" text-anchor="middle">select card or easy-pay wallet</text><line class="note-rule" x1="28" y1="360.0" x2="628" y2="360.0"/><rect class="note" x="207.27499999999992" y="349" width="241.45000000000013" height="22" rx="4"/><text class="note-tx" x="328.0" y="364.0" text-anchor="middle">Response field set varies by payMethod</text><line class="ar-req ar" x1="129.0" y1="406" x2="526.0" y2="406" marker-end="url(#mk-req)"/><text class="lb-req" x="328.0" y="400" text-anchor="middle">6. Authenticate / approve payment</text><line class="ar-req ar" x1="527.0" y1="447" x2="330.0" y2="447" marker-end="url(#mk-req)"/><text class="lb-req" x="428.0" y="441" text-anchor="middle">7. Payment Authorization callback</text><text class="lb-proto" x="428.0" y="460" text-anchor="middle">( POST {returnUrl} )</text><text class="lb-sub" x="428.0" y="473" text-anchor="middle">success: false, status: failed</text></g>
</svg>